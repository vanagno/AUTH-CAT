# Builds the authcat package and uploads it to PyPI when a release is
# published on GitHub. RELEASING.md describes the setup and the steps.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The release tag must name the version being built: PyPI refuses a
      # version it already has, so a forgotten __version__ fails the upload.
      - name: Check that the release tag matches the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('authcat/__init__.py').read_text()).group(1))")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The release tag is $GITHUB_REF_NAME, but authcat/__init__.py gives version $version. Set __version__ = \"${GITHUB_REF_NAME#v}\" (or tag the release v$version), then publish the release again."
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/authcat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
